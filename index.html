
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website đang bảo trì</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #063b78, #0878c9, #00a6d6);
    color: white;
    overflow: hidden;
}

.maintenance {
    width: 90%;
    max-width: 600px;
    text-align: center;
    padding: 45px 25px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 22px;
    backdrop-filter: blur(12px);
    box-shadow: 0 15px 45px rgba(0,0,0,0.2);
}

.gear {
    font-size: 75px;
    display: inline-block;
    animation: rotate 4s linear infinite;
    margin-bottom: 20px;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

h1 {
    font-size: 30px;
    margin-bottom: 18px;
    font-weight: 800;
    letter-spacing: 1px;
}

.message {
    font-size: 17px;
    line-height: 1.8;
    margin-bottom: 15px;
}

.apology {
    font-size: 15px;
    opacity: 0.9;
    margin-bottom: 30px;
}

/* Loading chạy qua lại */
.loading {
    width: 220px;
    height: 7px;
    background: rgba(255,255,255,0.25);
    border-radius: 20px;
    margin: 0 auto 15px;
    overflow: hidden;
    position: relative;
}

.loading span {
    position: absolute;
    width: 65px;
    height: 100%;
    background: #ffffff;
    border-radius: 20px;
    animation: move 1.3s ease-in-out infinite alternate;
}

@keyframes move {
    from { left: 0; }
    to { left: calc(100% - 65px); }
}

.loading-text {
    font-size: 13px;
    letter-spacing: 2px;
    animation: blink 1.2s infinite;
}

@keyframes blink {
    50% { opacity: 0.4; }
}

.footer {
    margin-top: 35px;
    font-size: 12px;
    opacity: 0.75;
}

@media(max-width: 480px) {
    h1 { font-size: 23px; }
    .message { font-size: 15px; }
    .gear { font-size: 60px; }
}
</style>
</head>

<body>

<div class="maintenance">

    <div class="gear">⚙️</div>

    <h1>WEBSITE ĐANG BẢO TRÌ</h1>

    <p class="message">
        Hệ thống hiện đang được nâng cấp và bảo trì
        nhằm cải thiện chất lượng dịch vụ.
        <br>
        <strong>QUÝ KHÁCH HÀNG VUI LÒNG TRUY CẬP LẠI SAU!</strong>
    </p>

    <p class="apology">
        Chúng tôi thành thật xin lỗi vì sự bất tiện này.
        <br>
        Rất mong quý khách hàng thông cảm!
    </p>

    <div class="loading">
        <span></span>
    </div>

    <div class="loading-text">
        HỆ THỐNG ĐANG XỬ LÝ...
    </div>

    <div class="footer">
        © 2026 - Mr.Thiên
    </div>

</div>

</body>
</html>
